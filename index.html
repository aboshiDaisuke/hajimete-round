<!-- Three.js：配信時は同梱版、ファイルを直接開く場合はCDN -->
<script>
(() => {
  const base = location.protocol === 'file:' || window.GOLF_ARTIFACT
    ? 'https://cdn.jsdelivr.net/npm/three@0.170.0/'
    : new URL('vendor/three/', document.baseURI).href;
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports: {
    'three': base + 'build/three.module.js',
    'three/addons/': base + 'examples/jsm/'
  } });
  document.head.appendChild(map);
})();
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.THREE_ADDONS = { OrbitControls, GLTFLoader };
window.THREE = THREE;
window.dispatchEvent(new Event('three-ready'));
</script>
